<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anamorphic Cloud</title>
<meta name="description" content="A drifting cloud of glowing particles that spells hello world from one hidden point of view.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Instrument+Serif:ital@1&amp;display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #03060e;
    --sky-top: #02040a;
    --sky-bottom: #0a1631;
    --sky-glow: #1a2b5a;
    --p-moon: #d3e1ff;
    --p-cyan: #93e7ff;
    --p-lavender: #c2b3ff;
    --p-amber: #ffbb6b;
    --p-gold: #ffc775;
    --ink: #e1e9ff;
    --ink-soft: #b4c1e4;
    --ink-muted: #7d8bb3;
    --surface: #0b142cb8;
    --surface-hover: #15224bd9;
    --line: #2a3a6a;
    --line-strong: #5068ab;
    --focus: #ffd38a;
    --font-mono: "DM Mono", ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --font-serif: "Instrument Serif", "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --gutter: 16px;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); overflow: hidden; font-family: var(--font-mono); -webkit-font-smoothing: antialiased; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #scene.grabbing { cursor: grabbing; }
  .bar {
    position: fixed; display: flex; align-items: center; justify-content: space-between; gap: 12px; pointer-events: none;
    top: max(14px, env(safe-area-inset-top));
    left: max(var(--gutter), env(safe-area-inset-left));
    right: max(var(--gutter), env(safe-area-inset-right));
  }
  #readout { font: 400 12px/1.2 var(--font-mono); letter-spacing: .08em; color: var(--ink-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  #find {
    pointer-events: auto; cursor: pointer; white-space: nowrap; min-height: 40px; padding: 0 16px;
    font: 500 13px/1 var(--font-mono); letter-spacing: .03em; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    transition: background-color .2s ease, border-color .2s ease;
  }
  #find:hover { background: var(--surface-hover); border-color: var(--line-strong); }
  #find:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  #hint {
    position: fixed; margin: 0; text-align: center; pointer-events: none;
    left: max(var(--gutter), env(safe-area-inset-left));
    right: max(var(--gutter), env(safe-area-inset-right));
    bottom: max(24px, calc(env(safe-area-inset-bottom) + 12px));
    font: italic 400 19px/1.3 var(--font-serif); color: var(--ink-soft);
    transition: opacity 1.6s ease;
  }
  #hint.gone { opacity: 0; }
  #nogl { position: fixed; inset: 0; margin: 0; display: grid; place-items: center; padding: 24px; text-align: center; font: 400 15px/1.6 var(--font-mono); color: var(--ink-soft); }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { #hint, #find { transition: none; } }
</style>
</head>
<body>
<canvas id="scene" role="img" aria-label="A drifting cloud of glowing particles. From one hidden angle, some of the particles line up to spell hello world. Drag, or use the arrow keys, to change the point of view."></canvas>
<div class="bar">
  <div id="readout">AZ 336.0° · EL 6.0°</div>
  <button id="find" type="button">Find the angle</button>
</div>
<p id="hint">Drag to change your point of view.</p>
<p id="nogl" hidden>This animation needs WebGL 2, which this browser or device does not provide.</p>
<script>
(() => {
'use strict';

// ------------------------------------------------------------------ settings
// Right-handed, Y up, cloud centred at the origin. The camera orbits at radius R:
// eye = R·(cos el·sin az, sin el, cos el·cos az), looking at the origin with no roll.
const DEG = Math.PI / 180;
const R = 30;
const MAGIC = Object.freeze({ az: 38, el: 14 });   // the secret eye E, degrees
const START = { az: -24, el: 6 };                  // default first view, about 61° from E
const EL_LIMIT = 70 * DEG;
const BASE_FOV = 50;                               // vertical FOV on wide screens, degrees
const ZOOM_MIN = 0.5, ZOOM_MAX = 4;                // zoom scales tan(fov/2); the eye never moves
const N_TOTAL = 18000, OUTLIER_SHARE = 0.05;
const BETA = 0.2;                                  // peak chance that a particle becomes text
const TEXT_SCALE = 2.65;                           // world units per x-height on the text plane
const SWELL = 0.8;                                 // bob along sight lines from E, world units
const DRAG_RATE = 0.004;                           // radians per CSS pixel
const SNAP_DEG = 4.5, SNAP_MS = 900, GLIDE_MS = 2200, TOUR_IDLE_MS = 7000;

const params = new URLSearchParams(location.search);
const numParam = (k) => {
  const v = params.get(k);
  if (v === null || v.trim() === '') return null;
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
};
const fixedT = numParam('t');
const layer = params.get('layer');
const seed = params.get('seed') || '1';
const tourParam = params.get('tour') !== '0';
const motionQuery = matchMedia('(prefers-reduced-motion: reduce)');
let reduced = motionQuery.matches;

// ------------------------------------------------------------------ small maths
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const wrapPi = (a) => a - 2 * Math.PI * Math.floor((a + Math.PI) / (2 * Math.PI));
const easeSine = (t) => 0.5 - 0.5 * Math.cos(Math.PI * t);
const easeCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(2 - 2 * t, 3) / 2);
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = (a) => { const l = Math.hypot(a[0], a[1], a[2]); return [a[0] / l, a[1] / l, a[2] / l]; };
const eyeDir = (az, el) => [Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az)];
// Angle between unit vectors; the chord form keeps precision near zero.
const angleBetween = (a, b) => 2 * Math.asin(Math.min(1, Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]) / 2));

// Seeded PRNG (xmur3 hash feeding sfc32): the same seed always builds the same cloud.
function makeRandom(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  const next = () => { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return (h ^= h >>> 16) >>> 0; };
  let a = next(), b = next(), c = next(), d = next();
  return () => {
    a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0;
    let t = (a + b) | 0;
    a = b ^ (b >>> 9); b = (c + (c << 3)) | 0; c = (c << 21) | (c >>> 11); d = (d + 1) | 0;
    t = (t + d) | 0; c = (c + t) | 0;
    return (t >>> 0) / 4294967296;
  };
}

// The secret eye E and the text plane: through the origin, facing E, axes matching E's screen.
const E_DIR = eyeDir(MAGIC.az * DEG, MAGIC.el * DEG);
const E_POS = E_DIR.map((v) => v * R);
const E_FWD = E_DIR.map((v) => -v);
const E_RIGHT = norm(cross(E_FWD, [0, 1, 0]));
const E_UP = cross(E_RIGHT, E_FWD);

// ------------------------------------------------------------------ glyphs
// Monoline geometric lowercase in x-height units: baseline y = 0, x-height 1, ascender 1.55,
// bowls are circles of radius 0.5. 'L' is a polyline; 'A' is an arc (cx, cy, r, from°, to°),
// running clockwise when to° < from°. Side types set the spacing between neighbours.
const ASC = 1.55, STROKE = 0.16, LINE_GAP = 2.05, BASELINE = 0.36;
const GLYPHS = {
  h: { w: 1, l: 's', r: 's', d: [['L', 0, 0, 0, ASC], ['A', 0.5, 0.5, 0.5, 180, 0], ['L', 1, 0.5, 1, 0]] },
  e: { w: 1, l: 'o', r: 'o', d: [['L', 0, 0.5, 1, 0.5], ['A', 0.5, 0.5, 0.5, 0, 318]] },
  l: { w: 0, l: 's', r: 's', d: [['L', 0, 0, 0, ASC]] },
  o: { w: 1, l: 'o', r: 'o', d: [['A', 0.5, 0.5, 0.5, 0, 360]] },
  w: { w: 1.3, l: 'v', r: 'v', d: [['L', 0, 1, 0.325, 0, 0.65, 1, 0.975, 0, 1.3, 1]] },
  r: { w: 0.8, l: 's', r: 'n', d: [['L', 0, 0, 0, 1], ['A', 0.5, 0.5, 0.5, 180, 55]] },
  d: { w: 1, l: 'o', r: 's', d: [['A', 0.5, 0.5, 0.5, 0, 360], ['L', 1, 0, 1, ASC]] },
};
const SIDE = { s: 0.22, o: 0.15, v: 0.09, n: 0.12 };

// Rasterise "hello" over "world" into the stroke mask S, then blur it into B on a coarse grid.
function buildMask() {
  const PX = 64, CF = 4, BOX = 7;                  // mask px per x-height, coarse factor, box radius
  const lines = ['hello', 'world'].map((word, li) => {
    let x = 0;
    const items = [];
    for (let i = 0; i < word.length; i++) {
      const g = GLYPHS[word[i]];
      if (i) x += SIDE[GLYPHS[word[i - 1]].r] + SIDE[g.l];
      items.push({ g, x });
      x += g.w;
    }
    return { items, w: x, y: BASELINE - li * LINE_GAP };
  });
  const halfW = Math.max(...lines.map((l) => l.w)) / 2 + STROKE / 2;
  const top = BASELINE + ASC + STROKE / 2, bottom = BASELINE - LINE_GAP - STROKE / 2;
  const pad = 1.6;                                 // more than the blur's reach
  const x0 = -halfW - pad, y1 = top + pad;
  const W = Math.ceil((2 * halfW + 2 * pad) * PX / CF) * CF;
  const H = Math.ceil((top - bottom + 2 * pad) * PX / CF) * CF;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const g2 = cv.getContext('2d', { willReadFrequently: true });
  g2.setTransform(PX, 0, 0, -PX, -x0 * PX, y1 * PX);   // x-height units, y up
  g2.lineWidth = STROKE; g2.lineCap = 'round'; g2.lineJoin = 'round'; g2.strokeStyle = '#fff';
  for (const line of lines) {
    for (const { g, x } of line.items) {
      const ox = x - line.w / 2, oy = line.y;
      g2.beginPath();
      for (const s of g.d) {
        if (s[0] === 'L') {
          g2.moveTo(ox + s[1], oy + s[2]);
          for (let k = 3; k < s.length; k += 2) g2.lineTo(ox + s[k], oy + s[k + 1]);
        } else {
          const [, cx, cy, r, a0, a1] = s;
          g2.moveTo(ox + cx + r * Math.cos(a0 * DEG), oy + cy + r * Math.sin(a0 * DEG));
          g2.arc(ox + cx, oy + cy, r, a0 * DEG, a1 * DEG, a1 < a0);
        }
      }
      g2.stroke();
    }
  }
  const rgba = g2.getImageData(0, 0, W, H).data;
  const S = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) S[i] = rgba[i * 4 + 3] >= 128 ? 1 : 0;

  // B = S blurred by a Gaussian: area-average onto the coarse grid, then three box blurs per axis.
  const BW = W / CF, BH = H / CF;
  let B = new Float32Array(BW * BH), T = new Float32Array(BW * BH);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (S[y * W + x]) B[((y / CF) | 0) * BW + ((x / CF) | 0)] += 1 / (CF * CF);
  const box = (src, dst, n, stride, count, step) => {
    for (let c = 0; c < count; c++) {
      const base = c * step;
      let sum = 0;
      for (let i = -BOX; i < n + BOX; i++) {
        if (i + BOX < n) sum += src[base + (i + BOX) * stride];
        if (i - BOX - 1 >= 0) sum -= src[base + (i - BOX - 1) * stride];
        if (i >= 0 && i < n) dst[base + i * stride] = sum / (2 * BOX + 1);
      }
    }
  };
  for (let pass = 0; pass < 3; pass++) {
    box(B, T, BW, 1, BH, BW);                      // rows
    box(T, B, BH, BW, BW, 1);                      // columns
  }
  let bmax = 0;
  for (let i = 0; i < B.length; i++) bmax = Math.max(bmax, B[i]);
  // Three box passes of width w have variance 3(w²−1)/12; the landing kernel uses the same sigma.
  const sigma = Math.sqrt(((2 * BOX + 1) ** 2 - 1) / 4) / (PX / CF);
  return {
    sigma, bmax, halfW, top, bottom,
    S: (ux, uy) => {
      const px = Math.floor((ux - x0) * PX), py = Math.floor((y1 - uy) * PX);
      return px >= 0 && py >= 0 && px < W && py < H && S[py * W + px] === 1;
    },
    B: (ux, uy) => {
      const px = Math.floor((ux - x0) * PX / CF), py = Math.floor((y1 - uy) * PX / CF);
      return px >= 0 && py >= 0 && px < BW && py < BH ? B[py * BW + px] : 0;
    },
  };
}

// Even out the landing points (blue noise inside the strokes) with a few rounds of short-range
// repulsion in plane units. Moves stay near 0.05 x-height, far below sigma, so the density
// that hides the text elsewhere is unchanged; from E the strokes fill without clumps or holes.
function relax(land, mask) {
  const r = 0.085, key = (x, y) => (Math.floor(x / r) + 512) * 1024 + Math.floor(y / r) + 512;
  for (let round = 0; round < 6; round++) {
    const grid = new Map();
    for (const p of land) { const k = key(p[1], p[2]); if (!grid.has(k)) grid.set(k, []); grid.get(k).push(p); }
    for (const p of land) {
      let fx = 0, fy = 0;
      const cx = Math.floor(p[1] / r), cy = Math.floor(p[2] / r);
      for (let gx = cx - 1; gx <= cx + 1; gx++) for (let gy = cy - 1; gy <= cy + 1; gy++) {
        for (const q of grid.get((gx + 512) * 1024 + gy + 512) || []) {
          const dx = p[1] - q[1], dy = p[2] - q[2], d = Math.hypot(dx, dy);
          if (q === p || d >= r || d < 1e-6) continue;
          fx += dx / d * (r - d) * 0.5; fy += dy / d * (r - d) * 0.5;
        }
      }
      for (const s of [1, 0.5]) {                   // stay inside the stroke
        if (mask.S(p[1] + fx * s, p[2] + fy * s)) { p[1] += fx * s; p[2] += fy * s; break; }
      }
    }
  }
}

// ------------------------------------------------------------------ cloud
// Layout per particle (10 floats): position, sight-line direction (zero for ambient),
// seeds (size, phase, rate, colour class + 4 for outliers). Text particles come first.
function buildCloud(mask) {
  const rand = makeRandom('cloud:' + seed);
  let spare = null;
  const gauss = () => {
    if (spare !== null) { const s = spare; spare = null; return s; }
    let u, v, s;
    do { u = rand() * 2 - 1; v = rand() * 2 - 1; s = u * u + v * v; } while (s >= 1 || s === 0);
    const m = Math.sqrt(-2 * Math.log(s) / s);
    spare = v * m;
    return u * m;
  };
  const randDir = () => {
    const z = rand() * 2 - 1, a = rand() * 2 * Math.PI, r = Math.sqrt(1 - z * z);
    return [r * Math.cos(a), z, r * Math.sin(a)];
  };
  const nOut = Math.round(N_TOTAL * OUTLIER_SHARE), nCloud = N_TOTAL - nOut, nMain = Math.round(nCloud * 0.72);
  const P = new Float32Array(N_TOTAL * 3);
  const blobs = [];
  for (let i = 0; i < 6; i++) {
    const d = randDir(), r = 5.5 + 3.2 * rand();
    blobs.push({ c: d.map((v) => v * r), s: 2.0 + 1.4 * rand() });
  }
  for (let i = 0; i < nCloud; i++) {
    let x, y, z;
    if (i < nMain) {
      do { x = 7.2 * gauss(); y = 5.6 * gauss(); z = 7.2 * gauss(); } while (x * x + y * y + z * z > 272);
    } else {
      const b = blobs[i % blobs.length];
      x = b.c[0] + b.s * gauss(); y = b.c[1] + b.s * gauss(); z = b.c[2] + b.s * gauss();
    }
    P[i * 3] = x; P[i * 3 + 1] = y; P[i * 3 + 2] = z;
  }
  for (let i = nCloud; i < N_TOTAL; i++) {          // sparse outliers in a wider sphere
    const d = randDir(), r = Math.cbrt(729 + rand() * (10648 - 729));   // radius 9..22
    P[i * 3] = d[0] * r; P[i * 3 + 1] = d[1] * r; P[i * 3 + 2] = d[2] * r;
  }
  const seeds = new Float32Array(N_TOTAL * 4);      // drawn the same way for every particle
  for (let i = 0; i < N_TOTAL; i++) {
    const c = rand();
    seeds[i * 4] = rand(); seeds[i * 4 + 1] = rand(); seeds[i * 4 + 2] = rand();
    seeds[i * 4 + 3] = (c < 0.67 ? 0 : c < 0.86 ? 1 : c < 0.97 ? 2 : 3) + (i >= nCloud ? 4 : 0);
  }

  // Relocation. u is where the sight line from E through P meets the text plane. With chance
  // β·B(u)/Bmax, P moves sideways onto a stroke point u' drawn from the same Gaussian around u,
  // keeping its distance from E. Density is unchanged at scales above sigma (hidden elsewhere);
  // from E the stroke density is uniform because rate and landing kernel share B.
  const isText = new Uint8Array(N_TOTAL);
  const land = [];                                  // [particle, u'x, u'y] for each text particle
  for (let i = 0; i < nCloud; i++) {
    const dx = P[i * 3] - E_POS[0], dy = P[i * 3 + 1] - E_POS[1], dz = P[i * 3 + 2] - E_POS[2];
    const along = dx * E_FWD[0] + dy * E_FWD[1] + dz * E_FWD[2];
    if (along < 1) continue;
    const k = R / along / TEXT_SCALE;
    const ux = k * (dx * E_RIGHT[0] + dy * E_RIGHT[1] + dz * E_RIGHT[2]);
    const uy = k * (dx * E_UP[0] + dy * E_UP[1] + dz * E_UP[2]);
    const b = mask.B(ux, uy);
    if (b <= 0 || rand() >= BETA * b / mask.bmax) continue;
    for (let tries = 0; tries < 64; tries++) {
      const vx = ux + mask.sigma * gauss(), vy = uy + mask.sigma * gauss();
      if (mask.S(vx, vy)) { land.push([i, vx, vy]); isText[i] = 1; break; }
    }
  }
  relax(land, mask);
  const dirs = new Float32Array(N_TOTAL * 3);
  for (const [i, vx, vy] of land) {
    // T − E for the landing point T on the plane (E = −R·fwd and the plane passes the origin).
    const tx = R * E_FWD[0] + (E_RIGHT[0] * vx + E_UP[0] * vy) * TEXT_SCALE;
    const ty = R * E_FWD[1] + (E_RIGHT[1] * vx + E_UP[1] * vy) * TEXT_SCALE;
    const tz = R * E_FWD[2] + (E_RIGHT[2] * vx + E_UP[2] * vy) * TEXT_SCALE;
    const tl = Math.hypot(tx, ty, tz);
    const dist = Math.hypot(P[i * 3] - E_POS[0], P[i * 3 + 1] - E_POS[1], P[i * 3 + 2] - E_POS[2]);
    for (let a = 0; a < 3; a++) {
      dirs[i * 3 + a] = [tx, ty, tz][a] / tl;
      P[i * 3 + a] = E_POS[a] + dirs[i * 3 + a] * dist;
    }
  }
  const data = new Float32Array(N_TOTAL * 10);
  let nText = 0;
  for (let i = 0; i < N_TOTAL; i++) nText += isText[i];
  let ti = 0, ai = nText;
  for (let i = 0; i < N_TOTAL; i++) {
    const o = (isText[i] ? ti++ : ai++) * 10;
    data.set(P.subarray(i * 3, i * 3 + 3), o);
    data.set(dirs.subarray(i * 3, i * 3 + 3), o + 3);
    data.set(seeds.subarray(i * 4, i * 4 + 4), o + 6);
  }
  return { data, nText, nAmbient: N_TOTAL - nText };
}

const mask = buildMask();
const cloud = buildCloud(mask);
const FIT_HALF_WIDTH = mask.halfW * TEXT_SCALE * 1.22;   // world units the view must keep visible at E

// ------------------------------------------------------------------ camera state
const cam = { az: START.az * DEG, el: START.el * DEG, zoom: 1 };
let mode = 'idle';
let anim = null;            // eased camera move: from, deltas, start time, duration, easing
let tour = null;            // { i } index into TOUR while touring
let vel = { az: 0, el: 0 };
let lastInput = -Infinity;
let gestureFrom = 0;        // alignment when the current gesture began, degrees
let ready = false, frames = 0;

const azParam = numParam('az'), elParam = numParam('el'), fovParam = numParam('fov');
if (azParam !== null) cam.az = wrapPi(azParam * DEG);
if (elParam !== null) cam.el = clamp(elParam * DEG, -EL_LIMIT, EL_LIMIT);

const canvas = document.getElementById('scene');
const readout = document.getElementById('readout');
const findBtn = document.getElementById('find');
const hintEl = document.getElementById('hint');
const dpr = () => Math.min(window.devicePixelRatio || 1, 2);
const viewAspect = () => (canvas.clientWidth || innerWidth) / Math.max(1, canvas.clientHeight || innerHeight);
// Vertical tan(fov/2) before zoom: widened on narrow screens so the text block fits with margin.
const baseTan = (aspect) => Math.max(Math.tan(BASE_FOV * DEG / 2), FIT_HALF_WIDTH / R / aspect);
const tanHalf = () => baseTan(viewAspect()) / cam.zoom;
const clampZoom = (z) => clamp(z, ZOOM_MIN, ZOOM_MAX);
if (fovParam !== null) cam.zoom = clampZoom(baseTan(viewAspect()) / Math.tan(clamp(fovParam, 1, 170) * DEG / 2));
const alignDeg = () => angleBetween(eyeDir(cam.az, cam.el), E_DIR) / DEG;
const wrapDeg = (d) => { const w = ((d % 360) + 540) % 360 - 180; return w === -180 ? 180 : w; };

Object.defineProperty(window, '__cloud', {
  enumerable: true,
  value: Object.freeze(Object.create(null, {
    ready: { enumerable: true, get: () => ready },
    frame: { enumerable: true, get: () => frames },
    magic: { enumerable: true, value: MAGIC },
    counts: { enumerable: true, value: Object.freeze({ text: cloud.nText, ambient: cloud.nAmbient }) },
    view: { enumerable: true, value: () => ({ az: wrapDeg(cam.az / DEG), el: cam.el / DEG, fov: 2 * Math.atan(tanHalf()) / DEG }) },
    alignment: { enumerable: true, value: () => alignDeg() },
    mode: { enumerable: true, value: () => mode },
  })),
});

// ------------------------------------------------------------------ WebGL
const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false, powerPreference: 'high-performance' });
const fail = (why) => {
  if (why) console.warn('Anamorphic Cloud: ' + why);
  document.getElementById('nogl').hidden = false;
  for (const el of [canvas, hintEl, document.querySelector('.bar')]) el.hidden = true;
};
if (!gl) { fail(); return; }

const PARTICLE_VS = `#version 300 es
precision highp float;
layout(location = 0) in vec3 a_pos;
layout(location = 1) in vec3 a_dir;    // unit sight line from E for text particles, zero for ambient
layout(location = 2) in vec4 a_seed;   // size, phase, rate, colour class (+4 for outliers)
uniform mat4 u_view, u_proj;
uniform vec3 u_eyeE;
uniform float u_time, u_ppu, u_aperture, u_focus, u_hint, u_lock, u_minPx, u_maxPx, u_swell;
uniform vec3 u_pal[5];                 // moon, cyan, lavender, amber, gold
out vec3 v_col;
out float v_quad, v_core, v_disc, v_blur, v_halo;

// Smooth travelling phase: neighbours bob together.
float swell(vec3 p, float t) {
  return 0.5 * t + dot(p, vec3(0.17, 0.21, -0.13)) + 0.9 * sin(dot(p, vec3(-0.11, 0.09, 0.16)) + 0.2 * t);
}
// Coherent drift for ambient particles: a few transverse plane waves, about 0.4 units at most.
vec3 drift(vec3 p, float t) {
  return vec3(0.62, 0.12, -0.78) * (0.16 * sin(dot(p, vec3(0.06, 0.31, 0.17)) + 0.29 * t + 1.3))
       + vec3(-0.10, 0.83, 0.55) * (0.14 * sin(dot(p, vec3(0.30, 0.03, -0.12)) + 0.34 * t + 4.1))
       + vec3(0.70, -0.42, 0.58) * (0.12 * sin(dot(p, vec3(-0.15, 0.21, 0.24)) + 0.23 * t + 2.2));
}

void main() {
  int code = int(a_seed.w + 0.5);
  bool outlier = code >= 4;
  float text = step(0.5, dot(a_dir, a_dir));
  float t = u_time;
  float s = u_swell * sin(swell(a_pos, t));
  vec3 p = a_pos;
  if (text > 0.5) {
    p += a_dir * s;                    // along its own sight line from E: invisible from E
  } else {
    // Ambient particles share the swell along their own line from E, so off-angle the text
    // particles move with their neighbours; the drift and wobble are what E sees move.
    vec3 wob = 0.06 * sin(vec3(0.71, 0.93, 0.82) * t * (0.6 + a_seed.z) + a_seed.y * vec3(6.283, 12.1, 3.7));
    p += normalize(a_pos - u_eyeE) * s + drift(a_pos, t) + wob;
  }
  vec4 vp = u_view * vec4(p, 1.0);
  float depth = max(-vp.z, 0.05);
  gl_Position = u_proj * vp;

  float wsize = outlier ? mix(0.07, 0.16, a_seed.x) : mix(0.045, 0.17, pow(a_seed.x, 3.0));
  wsize *= 1.0 + 0.65 * u_lock * text;                    // text swells a little at the angle
  float core = wsize * u_ppu / depth;                     // perspective size in device px
  float energy = 1.0;
  if (core < u_minPx) { energy = (core / u_minPx) * (core / u_minPx); core = u_minPx; }
  float coc = u_aperture * u_ppu * abs(depth - u_focus) / (depth * u_focus);
  coc *= 1.0 - 0.9 * u_lock * text;                       // text comes into focus at the angle
  float disc = core + coc;
  energy *= max((core / disc) * (core / disc), 0.05);     // blur spreads the same light wider
  float quad = min(max(core * 3.2, disc + 2.0), u_maxPx);
  gl_PointSize = quad;

  float rate = 0.5 + 1.8 * a_seed.z;
  float tw = 0.76 + 0.24 * sin(t * rate + a_seed.y * 6.2832);
  tw += 0.6 * pow(max(0.0, sin(t * 0.37 * rate + a_seed.y * 40.0)), 30.0);
  float fade = mix(1.0, 0.55, smoothstep(u_focus - 8.0, u_focus + 14.0, depth));
  float level = 0.46 * (0.5 + fract(a_seed.y * 13.37));
  vec3 col = u_pal[code & 3];
  col = mix(col, u_pal[4], text * (0.3 * u_hint * u_hint + 0.7 * u_lock));
  float gain = text > 0.5 ? 1.0 + 1.0 * u_lock : 1.0 - 0.35 * u_lock;
  v_col = col * (level * tw * fade * gain * energy);
  v_quad = quad; v_core = core; v_disc = disc; v_blur = coc / disc;
  v_halo = 0.08 + 0.14 * u_lock * text;                   // aligned text glows into strokes
}`;

const PARTICLE_FS = `#version 300 es
precision highp float;
in vec3 v_col;
in float v_quad, v_core, v_disc, v_blur, v_halo;
out vec4 o;
void main() {
  float r = length(gl_PointCoord - 0.5) * v_quad;        // device px from the sprite centre
  float sc = max(0.36 * v_core, 0.55);
  float k = r * r / (sc * sc);
  float sharp = exp(-0.5 * k) + v_halo * exp(-0.125 * k); // Gaussian core plus a faint halo
  float rd = 0.5 * v_disc;
  float disc = 1.6 * clamp(rd - r + 0.5, 0.0, 1.0) * (0.8 + 0.2 * clamp(r / rd, 0.0, 1.0));
  float shape = mix(sharp, disc, smoothstep(0.1, 0.8, v_blur));
  if (shape < 0.003) discard;
  o = vec4(v_col * shape, 1.0);
}`;

const SKY_VS = `#version 300 es
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const SKY_FS = `#version 300 es
precision highp float;
uniform vec2 u_res;
uniform float u_horizon, u_el;
uniform vec3 u_top, u_bottom, u_glow;
out vec4 o;
float hash(vec2 p) { vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
void main() {
  vec2 uv = gl_FragCoord.xy / u_res;
  vec3 col = mix(u_bottom, u_top, smoothstep(-0.55, 0.85, uv.y - u_horizon));
  vec2 d = (gl_FragCoord.xy - 0.5 * u_res) / u_res.y;
  d.y += 0.12 * u_el;                                     // the glow drifts a little with elevation
  col += u_glow * (0.85 * exp(-dot(d, d) * 5.0));
  col += (hash(gl_FragCoord.xy) - 0.5) / 255.0 * 1.5;   // dither against banding
  o = vec4(col, 1.0);
}`;

const tokenColor = (name, fallback) => {
  const m = /^#([0-9a-f]{6})/i.exec(getComputedStyle(document.documentElement).getPropertyValue(name).trim());
  if (!m) return fallback;
  const n = parseInt(m[1], 16);
  return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255];
};
const COLORS = {
  top: tokenColor('--sky-top', [0.01, 0.02, 0.04]),
  bottom: tokenColor('--sky-bottom', [0.04, 0.09, 0.19]),
  glow: tokenColor('--sky-glow', [0.1, 0.17, 0.35]),
  pal: new Float32Array(['--p-moon', '--p-cyan', '--p-lavender', '--p-amber', '--p-gold'].flatMap((n) => tokenColor(n, [0.85, 0.9, 1]))),
};

let glr = null;             // GL resources, rebuilt after a context loss
function initGL() {
  const compile = (type, src) => {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS) && !gl.isContextLost()) throw new Error('shader compile failed: ' + gl.getShaderInfoLog(sh));
    return sh;
  };
  const link = (vs, fs) => {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS) && !gl.isContextLost()) throw new Error('program link failed: ' + gl.getProgramInfoLog(p));
    const u = {};
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS) || 0;
    for (let i = 0; i < n; i++) {
      const name = gl.getActiveUniform(p, i).name.replace(/\[0\]$/, '');
      u[name] = gl.getUniformLocation(p, name);
    }
    return { p, u };
  };
  const particles = link(PARTICLE_VS, PARTICLE_FS);
  const sky = link(SKY_VS, SKY_FS);
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, cloud.data, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 40, 0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 40, 12);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 40, 24);
  const skyVao = gl.createVertexArray();
  gl.bindVertexArray(null);
  const range = gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE);
  glr = { particles, sky, vao, skyVao, maxPoint: range ? range[1] : 64 };
}
try { initGL(); } catch (err) { fail(err.message); return; }
canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); glr = null; });
canvas.addEventListener('webglcontextrestored', () => { try { initGL(); } catch (err) { fail(err.message); } });

function viewMatrix(eye) {
  const f = norm([-eye[0], -eye[1], -eye[2]]);
  const r = norm(cross(f, [0, 1, 0]));
  const u = cross(r, f);
  return new Float32Array([r[0], u[0], -f[0], 0, r[1], u[1], -f[1], 0, r[2], u[2], -f[2], 0, -dot(r, eye), -dot(u, eye), dot(f, eye), 1]);
}
function projMatrix(th, aspect, near, far) {
  const f = 1 / th;
  return new Float32Array([f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) / (near - far), -1, 0, 0, 2 * far * near / (near - far), 0]);
}

let clock = fixedT ?? 0;    // particle clock, seconds
function draw() {
  const ratio = dpr();
  const w = Math.max(1, Math.round(canvas.clientWidth * ratio)), h = Math.max(1, Math.round(canvas.clientHeight * ratio));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  if (!glr) return;
  const th = tanHalf(), aspect = w / h;
  const eye = eyeDir(cam.az, cam.el).map((v) => v * R);
  const delta = alignDeg();
  gl.viewport(0, 0, w, h);
  gl.disable(gl.BLEND);
  const sky = glr.sky;
  gl.useProgram(sky.p);
  gl.uniform2f(sky.u.u_res, w, h);
  gl.uniform1f(sky.u.u_horizon, 0.5 + 0.5 * Math.tan(cam.el) / th);
  gl.uniform1f(sky.u.u_el, cam.el);
  gl.uniform3fv(sky.u.u_top, COLORS.top);
  gl.uniform3fv(sky.u.u_bottom, COLORS.bottom);
  gl.uniform3fv(sky.u.u_glow, COLORS.glow);
  gl.bindVertexArray(glr.skyVao);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  const pr = glr.particles, u = pr.u;
  gl.useProgram(pr.p);
  gl.uniformMatrix4fv(u.u_view, false, viewMatrix(eye));
  gl.uniformMatrix4fv(u.u_proj, false, projMatrix(th, aspect, 0.5, 120));
  gl.uniform3fv(u.u_eyeE, E_POS);
  gl.uniform1f(u.u_time, clock);
  gl.uniform1f(u.u_ppu, h / 2 / th);
  gl.uniform1f(u.u_aperture, 0.22);
  gl.uniform1f(u.u_focus, R);
  gl.uniform1f(u.u_hint, 1 - smoothstep(3, 28, delta));
  gl.uniform1f(u.u_lock, 1 - smoothstep(0.8, 6, delta));
  gl.uniform1f(u.u_minPx, 1.5);
  gl.uniform1f(u.u_maxPx, Math.min(glr.maxPoint, 160 * ratio));
  gl.uniform1f(u.u_swell, SWELL);
  gl.uniform3fv(u.u_pal, COLORS.pal);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);                 // additive, premultiplied colour
  gl.bindVertexArray(glr.vao);
  if (layer === 'text') gl.drawArrays(gl.POINTS, 0, cloud.nText);
  else if (layer === 'ambient') gl.drawArrays(gl.POINTS, cloud.nText, cloud.nAmbient);
  else gl.drawArrays(gl.POINTS, 0, N_TOTAL);
  gl.bindVertexArray(null);
}

// ------------------------------------------------------------------ camera motion
const tourAllowed = () => tourParam && !reduced;
const magicTarget = (zoom) => ({ az: MAGIC.az * DEG, el: MAGIC.el * DEG, zoom });

function beginAnim(target, ms, ease) {
  const now = performance.now();
  anim = target
    ? { az0: cam.az, el0: cam.el, z0: cam.zoom, daz: wrapPi(target.az - cam.az), del: target.el - cam.el, dz: (target.zoom ?? cam.zoom) - cam.zoom, t0: now, ms, ease, target }
    : { t0: now, ms, target: null };    // a hold
}
function stepAnim(now) {
  const k = clamp((now - anim.t0) / anim.ms, 0, 1);
  if (anim.target) {
    const s = anim.ease(k);
    cam.az = wrapPi(anim.az0 + anim.daz * s);
    cam.el = anim.el0 + anim.del * s;
    cam.zoom = anim.z0 + anim.dz * s;
  }
  if (k < 1) return false;
  if (anim.target) { cam.az = wrapPi(anim.target.az); cam.el = anim.target.el; cam.zoom = anim.target.zoom ?? cam.zoom; }
  anim = null;
  return true;
}

// Idle tour: start → E, hold, wander well away, back to E from another side, repeat.
const TOUR = ['E', 'hold', [140, 28], [250, -8], [330, 48], 'E', 'hold', [-60, -16], [-150, 22], [110, 42]];
function startTour(first) {
  mode = 'tour';
  tour = { i: 0 };
  if (first) beginAnim(null, 1000); else tourStep();
}
function tourStep() {
  const s = TOUR[tour.i++ % TOUR.length];
  if (s === 'hold') { beginAnim(null, 5000); return; }
  const target = s === 'E' ? magicTarget(1) : { az: s[0] * DEG, el: s[1] * DEG, zoom: 1 };
  const ang = angleBetween(eyeDir(cam.az, cam.el), eyeDir(target.az, target.el)) / DEG;
  beginAnim(target, (2.2 + ang / 10) * 1000, easeSine);
}
function stopAuto() {
  if (mode === 'tour' || mode === 'glide' || mode === 'snap' || mode === 'inertia') mode = 'idle';
  anim = null; tour = null; vel = { az: 0, el: 0 };
}
// The camera came to rest: ease into exact alignment when close, unless this gesture moved away from E.
function settle() {
  vel = { az: 0, el: 0 };
  const d = alignDeg();
  if (d < SNAP_DEG && d > 1e-4 && d <= gestureFrom + 0.1) {
    if (reduced) { Object.assign(cam, magicTarget(cam.zoom)); mode = 'idle'; }
    else { mode = 'snap'; beginAnim(magicTarget(cam.zoom), SNAP_MS, easeSine); }
  } else mode = 'idle';
}

function stepCamera(now, dt) {
  if (mode === 'inertia') {
    cam.az = wrapPi(cam.az + vel.az * dt);
    const el = cam.el + vel.el * dt;
    cam.el = clamp(el, -EL_LIMIT, EL_LIMIT);
    if (cam.el !== el) vel.el = 0;
    const decay = Math.exp(-dt / 0.3);
    vel.az *= decay; vel.el *= decay;
    if (Math.hypot(vel.az, vel.el) < 0.02) settle();
  } else if (anim && (mode === 'tour' || mode === 'glide' || mode === 'snap')) {
    if (stepAnim(now)) { if (mode === 'tour') tourStep(); else mode = 'idle'; }
  } else if (mode === 'idle' && tourAllowed() && now - lastInput > TOUR_IDLE_MS) {
    startTour(lastInput === -Infinity);
  }
}

// ------------------------------------------------------------------ input
const noteInput = () => { lastInput = performance.now(); };
const pointers = new Map();
let samples = [];           // recent drag positions for the release velocity
let pinch = null, dragged = 0;
const sample = () => { const t = performance.now(); samples.push({ t, az: cam.az, el: cam.el }); while (samples.length && t - samples[0].t > 120) samples.shift(); };
const spread = () => { const [a, b] = [...pointers.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };

canvas.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  try { canvas.setPointerCapture(e.pointerId); } catch { /* pointer already gone */ }
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  noteInput();
  if (mode !== 'drag') gestureFrom = alignDeg();
  stopAuto();
  mode = 'drag';
  samples = [];
  sample();
  pinch = pointers.size === 2 ? { d: spread(), zoom: cam.zoom } : null;
  canvas.classList.add('grabbing');
});
canvas.addEventListener('pointermove', (e) => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  noteInput();
  if (pointers.size === 1) {
    cam.az = wrapPi(cam.az - dx * DRAG_RATE);
    cam.el = clamp(cam.el + dy * DRAG_RATE, -EL_LIMIT, EL_LIMIT);
    dragged += Math.abs(dx) + Math.abs(dy);
    if (dragged > 6) hintEl.classList.add('gone');
    sample();
  } else if (pinch && pinch.d > 0) {
    cam.zoom = clampZoom(pinch.zoom * spread() / pinch.d);
  }
});
const release = (e) => {
  if (!pointers.delete(e.pointerId)) return;
  noteInput();
  samples = [];
  sample();
  if (pointers.size === 2) pinch = { d: spread(), zoom: cam.zoom };
  else pinch = null;
  if (pointers.size) return;                    // the remaining finger keeps dragging
  canvas.classList.remove('grabbing');
};
canvas.addEventListener('pointerup', (e) => {
  const recent = samples.slice();
  release(e);
  if (pointers.size || mode !== 'drag') return;
  // Release velocity from the last ~100 ms of movement; a pause before release means no coast.
  const now = performance.now(), a = recent[0], b = recent[recent.length - 1];
  const dt = b && a ? (b.t - a.t) / 1000 : 0;
  if (dt > 0.012 && now - b.t < 60) {
    vel = { az: wrapPi(b.az - a.az) / dt, el: (b.el - a.el) / dt };
    const speed = Math.hypot(vel.az, vel.el), cap = 3;   // rad/s; coasts at most about 50°
    if (speed > cap) { vel.az *= cap / speed; vel.el *= cap / speed; }
    if (speed > 0.15) { mode = 'inertia'; return; }
  }
  settle();
});
canvas.addEventListener('pointercancel', (e) => { release(e); if (!pointers.size && mode === 'drag') settle(); });
canvas.addEventListener('lostpointercapture', (e) => { if (pointers.has(e.pointerId)) { release(e); if (!pointers.size && mode === 'drag') settle(); } });

window.addEventListener('wheel', (e) => {
  e.preventDefault();
  const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1;
  noteInput();
  if (mode !== 'drag') stopAuto();
  cam.zoom = clampZoom(cam.zoom * Math.exp(-e.deltaY * unit * 0.0015));
}, { passive: false });

window.addEventListener('keydown', (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const step = 2 * DEG;
  const keys = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, step], ArrowDown: [0, -step] };
  const zoomKeys = { '+': 1.12, '=': 1.12, '-': 1 / 1.12, '_': 1 / 1.12 };
  if (!(e.key in keys) && !(e.key in zoomKeys)) return;
  e.preventDefault();
  noteInput();
  if (mode === 'drag') return;
  stopAuto();
  if (e.key in zoomKeys) { cam.zoom = clampZoom(cam.zoom * zoomKeys[e.key]); return; }
  gestureFrom = alignDeg();
  // Arrow keys move the viewpoint: right orbits the eye to its right, up raises it.
  cam.az = wrapPi(cam.az + keys[e.key][0]);
  cam.el = clamp(cam.el + keys[e.key][1], -EL_LIMIT, EL_LIMIT);
  settle();
});

findBtn.addEventListener('click', () => {
  noteInput();
  stopAuto();
  const target = magicTarget(Math.min(cam.zoom, 1));
  if (reduced) { Object.assign(cam, target); mode = 'idle'; return; }
  mode = 'glide';
  beginAnim(target, GLIDE_MS, easeCubic);
});

motionQuery.addEventListener('change', (e) => {
  reduced = e.matches;
  if (reduced && mode === 'tour') stopAuto();
});

// ------------------------------------------------------------------ main loop
let lastText = '';
function updateReadout() {
  let az = ((cam.az / DEG) % 360 + 360) % 360;
  if (az >= 359.95) az = 0;
  const text = `AZ ${az.toFixed(1)}° · EL ${(cam.el / DEG).toFixed(1)}°`;
  if (text !== lastText) { readout.textContent = text; lastText = text; }
}
let last = performance.now();
function tick(now) {
  const dt = clamp((now - last) / 1000, 0, 0.1);
  last = now;
  if (fixedT === null) clock += dt * (reduced ? 0.35 : 1);
  stepCamera(now, dt);
  draw();
  updateReadout();
  if (glr) { frames++; ready = true; }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
