<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anamorphic Cloud</title>
<meta name="description" content="A drifting cloud of glowing particles that hides six messages, each read from its own point of view: hello world, a smiling face, What, a, beautiful, world.">
<style>
  :root {
    color-scheme: dark;
    --bg: #03060e;
    --sky-top: #02040a;
    --sky-bottom: #0a1631;
    --sky-glow: #1a2b5a;
    --p-moon: #d3e1ff;
    --p-cyan: #93e7ff;
    --p-lavender: #c2b3ff;
    --p-amber: #ffbb6b;
    --ink: #e1e9ff;
    --ink-soft: #b4c1e4;
    --ink-muted: #7d8bb3;
    --surface: #0b142cb8;
    --surface-hover: #15224bd9;
    --line: #2a3a6a;
    --line-strong: #5068ab;
    --focus: #ffd38a;
    --font-mono: "DM Mono", ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --font-serif: "Instrument Serif", "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --gutter: 16px;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); overflow: hidden; font-family: var(--font-mono); -webkit-font-smoothing: antialiased; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #scene.grabbing { cursor: grabbing; }
  #scene:focus-visible { outline: 2px solid var(--focus); outline-offset: -4px; }
  .bar {
    position: fixed; display: flex; align-items: center; justify-content: space-between; gap: 12px; pointer-events: none;
    top: max(14px, env(safe-area-inset-top));
    left: max(var(--gutter), env(safe-area-inset-left));
    right: max(var(--gutter), env(safe-area-inset-right));
  }
  /* When a narrow screen and a wide font leave too little room, the readout gives way to the buttons. */
  #readout { font: 400 12px/1.2 var(--font-mono); letter-spacing: .08em; color: var(--ink-muted); white-space: nowrap; font-variant-numeric: tabular-nums; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .actions { display: flex; gap: 8px; }
  .actions button {
    pointer-events: auto; cursor: pointer; white-space: nowrap; min-height: 40px; padding: 0 16px;
    font: 500 13px/1 var(--font-mono); letter-spacing: .03em; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    transition: background-color .2s ease, border-color .2s ease;
  }
  .actions button:hover { background: var(--surface-hover); border-color: var(--line-strong); }
  .actions button:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  #hint {
    position: fixed; margin: 0; text-align: center; pointer-events: none;
    left: max(var(--gutter), env(safe-area-inset-left));
    right: max(var(--gutter), env(safe-area-inset-right));
    bottom: max(24px, calc(env(safe-area-inset-bottom) + 12px));
    font: italic 400 19px/1.3 var(--font-serif); color: var(--ink-soft);
    transition: opacity 1.6s ease;
  }
  #hint.gone { opacity: 0; }
  #nogl { position: fixed; inset: 0; margin: 0; display: grid; place-items: center; padding: 24px; text-align: center; font: 400 15px/1.6 var(--font-mono); color: var(--ink-soft); }
  /* Capture mode (#capture): no chrome, no cursor and no focus outline, for recording the sequence. */
  .capture .bar, .capture #hint { display: none; }
  .capture #scene { cursor: none; }
  .capture #scene:focus-visible { outline: none; }
  [hidden] { display: none !important; }
  @media (max-width: 440px) {
    .bar { gap: 8px; }
    #readout { font-size: 11px; letter-spacing: .02em; }
    .actions { gap: 6px; }
    .actions button { padding: 0 12px; }
  }
  @media (prefers-reduced-motion: reduce) { #hint, .actions button { transition: none; } }
</style>
</head>
<body>
<canvas id="scene" role="application" tabindex="0" aria-roledescription="3D particle scene" aria-label="A drifting cloud of glowing particles. From six hidden angles, some of the particles line up to show hello world, a smiling face, and then What a beautiful world. Drag, or use the arrow keys, to change the point of view."></canvas>
<div class="bar">
  <div id="readout">AZ 8.0° · EL -16.0°</div>
  <div class="actions">
    <button id="find" type="button">Find the angle</button>
    <button id="play" type="button">Play</button>
  </div>
</div>
<p id="hint">Drag, or use the arrow keys, to change your point of view.</p>
<p id="nogl" hidden>This animation needs WebGL 2, which this browser or device does not provide.</p>
<script>
(() => {
'use strict';

// Optional web fonts, added from script so a slow or blocked font host never holds up the page.
const fontCss = document.createElement('link');
fontCss.rel = 'stylesheet';
fontCss.href = 'https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap';
document.head.append(fontCss);

// ------------------------------------------------------------------ settings
// Right-handed, Y up, cloud centred at the origin. The camera orbits at radius R:
// eye = R·(cos el·sin az, sin el, cos el·cos az), looking at the origin with no roll.
const DEG = Math.PI / 180;
const R = 30;
const START = { az: 8, el: -16 };                  // default first view, below the ring of eyes
const EL_LIMIT = 70 * DEG;
const BASE_FOV = 50;                               // vertical FOV on wide screens, degrees
const ZOOM_MIN = 0.5, ZOOM_MAX = 4;                // zoom scales tan(fov/2); the eye never moves
const N_TOTAL = 48000, OUTLIER_SHARE = 0.05;
// Peak chance that a particle becomes text. Text and ambient particles look alike, so each message
// shows from its eye by density alone. The cost: turning the camera keeps the text rows (azimuth)
// or columns (elevation) as faint streaks; the letters lean (SLANT) so that the columns spread
// (measurements in docs/work/0_hello-world-cloud and docs/work/1_sentence-sequence).
const BETA_DEFAULT = 0.85;
const SWELL = 0.8;                                 // bob along sight lines from an eye, world units
const DRAG_RATE = 0.004;                           // radians per CSS pixel
const TOUCH_SLOP = 10;                             // CSS px a finger may slip before a pinch without it counting as a drag
const SNAP_DEG = 6, SNAP_MS = 900, GLIDE_MS = 2200;
// The sequence: an eased glide to each message's eye in turn, then a hold exactly there.
const HOLD_MS = 3000, LOAD_HOLD_MS = 1500, CAPTURE_HOLD_MS = 2000, CUT_HOLD_MS = 4000;
const legMs = (deg) => 1500 + 50 * deg;            // glide time for an arc of `deg` degrees: 60° takes 4.5 s

const params = new URLSearchParams(location.search);
const numParam = (k) => {
  const v = params.get(k);
  if (v === null || v.trim() === '') return null;
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
};
const fixedT = numParam('t');
const layer = params.get('layer');
const seed = params.get('seed') || '1';
const tourParam = params.get('tour') !== '0';
// Test hook: beta=<0..1> sets β, the peak relocation chance; anything else keeps the default.
// Relocation draws from its own random streams, so the base cloud is the same for every β and
// render(β) − render(0) isolates what relocation adds.
const betaParam = numParam('beta');
const BETA = betaParam !== null && betaParam >= 0 && betaParam <= 1 ? betaParam : BETA_DEFAULT;
const motionQuery = matchMedia('(prefers-reduced-motion: reduce)');
let reduced = motionQuery.matches;

// ------------------------------------------------------------------ small maths
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const wrapPi = (a) => a - 2 * Math.PI * Math.floor((a + Math.PI) / (2 * Math.PI));
const easeSine = (t) => 0.5 - 0.5 * Math.cos(Math.PI * t);
const easeCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(2 - 2 * t, 3) / 2);
const easeQuint = (t) => t * t * t * (t * (6 * t - 15) + 10);   // smootherstep: starts and stops without a jolt
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = (a) => { const l = Math.hypot(a[0], a[1], a[2]); return [a[0] / l, a[1] / l, a[2] / l]; };
const eyeDir = (az, el) => [Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az)];
// Angle between unit vectors; the chord form keeps precision near zero.
const angleBetween = (a, b) => 2 * Math.asin(Math.min(1, Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]) / 2));

// Seeded PRNG (xmur3 hash feeding sfc32): the same seed always builds the same cloud.
function makeRandom(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  const next = () => { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return (h ^= h >>> 16) >>> 0; };
  let a = next(), b = next(), c = next(), d = next();
  return () => {
    a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0;
    let t = (a + b) | 0;
    a = b ^ (b >>> 9); b = (c + (c << 3)) | 0; c = (c << 21) | (c >>> 11); d = (d + 1) | 0;
    t = (t + d) | 0; c = (c + t) | 0;
    return (t >>> 0) / 4294967296;
  };
}

// ------------------------------------------------------------------ glyphs
// Monoline geometric glyphs in x-height units: baseline y = 0, x-height 1, ascender and capital
// height 1.55, bowls are circles of radius 0.5. 'L' is a polyline (a single point is a dot); 'A' is
// an arc (cx, cy, r, from°, to°), running clockwise when to° < from°. Side types set the spacing
// between neighbours. The glyphs are drawn upright here; words lean right by SLANT when they are
// rasterised. 'smile' is the face: a circle of radius 2 with two eyes and a smile.
const ASC = 1.55, LINE_GAP = 2.05;
// Italic lean, degrees. An elevation turn keeps every particle's screen column, so upright stems
// would show above and below an eye as vertical streaks; a leaning stem spreads over many columns.
const SLANT = 14;
const GLYPHS = {
  h: { w: 1, l: 's', r: 's', d: [['L', 0, 0, 0, ASC], ['A', 0.5, 0.5, 0.5, 180, 0], ['L', 1, 0.5, 1, 0]] },
  e: { w: 1, l: 'o', r: 'o', d: [['L', 0, 0.5, 1, 0.5], ['A', 0.5, 0.5, 0.5, 0, 318]] },
  l: { w: 0, l: 's', r: 's', d: [['L', 0, 0, 0, ASC]] },
  o: { w: 1, l: 'o', r: 'o', d: [['A', 0.5, 0.5, 0.5, 0, 360]] },
  w: { w: 1.3, l: 'v', r: 'v', d: [['L', 0, 1, 0.325, 0, 0.65, 1, 0.975, 0, 1.3, 1]] },
  r: { w: 0.8, l: 's', r: 'n', d: [['L', 0, 0, 0, 1], ['A', 0.5, 0.5, 0.5, 180, 55]] },
  d: { w: 1, l: 'o', r: 's', d: [['A', 0.5, 0.5, 0.5, 0, 360], ['L', 1, 0, 1, ASC]] },
  W: { w: 1.7, l: 'v', r: 'v', d: [['L', 0, ASC, 0.425, 0, 0.85, ASC, 1.275, 0, 1.7, ASC]] },
  a: { w: 1, l: 'o', r: 's', d: [['A', 0.5, 0.5, 0.5, 0, 360], ['L', 1, 0, 1, 1]] },
  t: { w: 0.7, l: 'n', r: 'n', d: [['L', 0.25, 1.35, 0.25, 0], ['L', 0, 1, 0.7, 1]] },
  b: { w: 1, l: 's', r: 'o', d: [['L', 0, 0, 0, ASC], ['A', 0.5, 0.5, 0.5, 0, 360]] },
  u: { w: 1, l: 's', r: 's', d: [['L', 0, 1, 0, 0.5], ['A', 0.5, 0.5, 0.5, 180, 360], ['L', 1, 1, 1, 0]] },
  i: { w: 0, l: 's', r: 's', d: [['L', 0, 0, 0, 1], ['L', 0, 1.3, 0, 1.4]] },
  f: { w: 0.8, l: 'n', r: 'n', d: [['L', 0.22, 0, 0.22, 1.2], ['A', 0.57, 1.2, 0.35, 180, 30], ['L', 0, 1, 0.62, 1]] },
  smile: { w: 4, l: 'o', r: 'o', d: [['A', 2, 2, 2, 0, 360], ['L', 1.3, 2.25, 1.3, 3.15], ['L', 2.7, 2.25, 2.7, 3.15], ['A', 2, 2.15, 1.25, 205, 335]] },
};
const SIDE = { s: 0.22, o: 0.15, v: 0.09, n: 0.12 };

// ------------------------------------------------------------------ messages
// Six messages hidden in one cloud, in the order the sequence shows them. Each is read from its
// own eye on the orbit sphere (az, el in degrees), through its own text plane: through the origin,
// facing that eye, axes matching that eye's screen. `scale` is world units per glyph unit; a
// message without one fills the width of "hello world" (so the narrow-screen field of view fits
// every message), up to `cap`. A message with `baseline` keeps that layout; others are centred.
// `weight` (1 unless set) scales a message's relocation chance: the face reads with margin at 0.6,
// which leaves more of the shared particles to the words and keeps its cone of sight lines faint
// from the other eyes.
const MESSAGES = [
  { name: 'hello-world', az: 38, el: 14, lines: ['hello', 'world'], slant: SLANT, scale: 2.65, baseline: 0.36 },
  { name: 'face', az: 98, el: 18, lines: [['smile']], slant: 0, cap: 2.4, weight: 0.6 },
  { name: 'what', az: 158, el: 16, lines: ['What'], slant: SLANT, cap: 3 },
  { name: 'a', az: 218, el: 20, lines: ['a'], slant: SLANT, cap: 5 },
  { name: 'beautiful', az: 278, el: 16, lines: ['beautiful'], slant: SLANT, cap: 3 },
  { name: 'world', az: 338, el: 18, lines: ['world'], slant: SLANT, cap: 3 },
];
const MAGIC = Object.freeze({ az: MESSAGES[0].az, el: MESSAGES[0].el });   // hello world's eye E, degrees
// Every message is drawn with the same particle ink in world units: strokes INK wide, and particles
// gathered onto them from a Gaussian catchment of width sigma (BOX, below). The glyphs scale.
const INK = 0.2;                                   // stroke width, world units
const MASK_PX = 24;                                // stroke-mask pixels per world unit
const BOX = 9;                                     // blur box radius in coarse mask pixels: sigma = √(BOX(BOX+1))/6 ≈ 1.58 world units

// An eye on the orbit sphere and the frame of its text plane.
function eyeFrame(az, el) {
  const dir = eyeDir(az * DEG, el * DEG);
  const fwd = dir.map((v) => -v);
  const right = norm(cross(fwd, [0, 1, 0]));
  return { dir, pos: dir.map((v) => v * R), fwd, right, up: cross(right, fwd) };
}

// A message's layout in glyph units: each line's glyphs along it, and the ink extents of the
// leaning centre lines. Each line leans about its own baseline: a glyph point (x, y) moves to
// (x + y·lean, y), so the stems lean and every stroke keeps its horizontal width, as in an oblique
// type. The extents follow the leaning centre lines (polyline corners, arcs sampled every degree);
// the block is later shifted so that its ink is centred on x = 0 (and on y = 0 unless the message
// keeps its own baseline).
function layout(msg) {
  const lean = Math.tan(msg.slant * DEG);
  const lines = msg.lines.map((line, li) => {
    const keys = [...line];                        // a string's characters, or a list of glyph names
    let x = 0;
    const items = [];
    for (let i = 0; i < keys.length; i++) {
      const g = GLYPHS[keys[i]];
      if (i) x += SIDE[GLYPHS[keys[i - 1]].r] + SIDE[g.l];
      items.push({ g, x });
      x += g.w;
    }
    return { items, w: x, y: msg.baseline === undefined ? 0 : msg.baseline - li * LINE_GAP };
  });
  let inkL = Infinity, inkR = -Infinity, inkB = Infinity, inkT = -Infinity;
  for (const line of lines) {
    let l = Infinity, r = -Infinity;
    const reach = (x, y) => { l = Math.min(l, x); r = Math.max(r, x); inkB = Math.min(inkB, line.y + y); inkT = Math.max(inkT, line.y + y); };
    for (const { g, x } of line.items) for (const s of g.d) {
      if (s[0] === 'L') for (let k = 1; k + 1 < s.length; k += 2) reach(x + (s[k] + s[k + 1] * lean), s[k + 1]);
      else for (let a = Math.min(s[4], s[5]); a <= Math.max(s[4], s[5]); a++) reach(x + (s[1] + s[3] * Math.cos(a * DEG) + (s[2] + s[3] * Math.sin(a * DEG)) * lean), s[2] + s[3] * Math.sin(a * DEG));
    }
    inkL = Math.min(inkL, l - line.w / 2); inkR = Math.max(inkR, r - line.w / 2);
  }
  if (msg.baseline === undefined) {
    const dy = -(inkB + inkT) / 2;
    for (const line of lines) line.y += dy;
    inkB += dy; inkT += dy;
  }
  return { lines, lean, inkL, inkR, inkB, inkT };
}
// The half-width of a message's ink in world units at glyph scale s: the centre lines plus a
// leaning round cap's half-width.
const inkHalfWidth = (L, s) => (L.inkR - L.inkL) / 2 * s + INK / 2 * Math.hypot(1, L.lean);

// Rasterise a message at glyph scale `scale` into its stroke mask S, then blur it into B on a
// coarse grid.
function buildMask(L, scale) {
  const CF = 4, PX = Math.round(MASK_PX * scale / CF) * CF;   // mask px per glyph unit, coarse factor
  const { lines, lean, inkL, inkR, inkB, inkT } = L, half = INK / scale / 2;
  const shift = -(inkL + inkR) / 2, halfW = (inkR - inkL) / 2 + half * Math.hypot(1, lean);
  const top = inkT + half, bottom = inkB - half;
  const pad = Math.max(1.6, 3.75 * BOX * CF / PX);   // more than the blur's reach (3 boxes)
  const x0 = -halfW - pad, y1 = top + pad;
  const W = Math.ceil((2 * halfW + 2 * pad) * PX / CF) * CF;
  const H = Math.ceil((top - bottom + 2 * pad) * PX / CF) * CF;
  // S comes straight from the geometry, so a seed builds the same cloud in every browser: a pixel
  // is inside when its centre, leaned back upright about the line's baseline `base`, lies within
  // half a stroke of a line or arc (round caps and joins).
  const S = new Uint8Array(W * H);
  const mark = (base, minX, maxX, minY, maxY, dist) => {
    const lo = (minY - half - base) * lean, hi = (maxY + half - base) * lean;   // the lean at the box's bottom and top
    const px0 = Math.max(0, Math.floor((minX - half + Math.min(lo, hi) - x0) * PX)), px1 = Math.min(W - 1, Math.ceil((maxX + half + Math.max(lo, hi) - x0) * PX));
    const py0 = Math.max(0, Math.floor((y1 - maxY - half) * PX)), py1 = Math.min(H - 1, Math.ceil((y1 - minY + half) * PX));
    for (let py = py0; py <= py1; py++) {
      const uy = y1 - (py + 0.5) / PX, back = (uy - base) * lean;
      for (let px = px0; px <= px1; px++) if (dist(x0 + (px + 0.5) / PX - back, uy) <= half) S[py * W + px] = 1;
    }
  };
  for (const line of lines) {
    for (const { g, x } of line.items) {
      const ox = x - line.w / 2 + shift, oy = line.y;
      for (const s of g.d) {
        if (s[0] === 'L') {
          for (let k = 1; k + 3 < s.length || (k === 1 && s.length === 3); k += 2) {
            const ax = ox + s[k], ay = oy + s[k + 1], dx = (s[k + 2] ?? s[k]) - s[k], dy = (s[k + 3] ?? s[k + 1]) - s[k + 1], len2 = dx * dx + dy * dy;
            mark(oy, Math.min(ax, ax + dx), Math.max(ax, ax + dx), Math.min(ay, ay + dy), Math.max(ay, ay + dy), (px, py) => {
              const t = len2 > 0 ? clamp(((px - ax) * dx + (py - ay) * dy) / len2, 0, 1) : 0;
              return Math.hypot(px - ax - t * dx, py - ay - t * dy);
            });
          }
        } else {
          const [, c0, c1, r, a0, a1] = s, cx = ox + c0, cy = oy + c1;
          const start = Math.min(a0, a1), span = Math.abs(a1 - a0);   // degrees, anticlockwise from start
          const ex = (a) => cx + r * Math.cos(a * DEG), ey = (a) => cy + r * Math.sin(a * DEG);
          mark(oy, cx - r, cx + r, cy - r, cy + r, (px, py) => {
            const ang = ((Math.atan2(py - cy, px - cx) / DEG - start) % 360 + 360) % 360;
            if (span >= 360 || ang <= span) return Math.abs(Math.hypot(px - cx, py - cy) - r);
            return Math.min(Math.hypot(px - ex(a0), py - ey(a0)), Math.hypot(px - ex(a1), py - ey(a1)));
          });
        }
      }
    }
  }

  // B = S blurred by a Gaussian: area-average onto the coarse grid, then three box blurs per axis.
  const BW = W / CF, BH = H / CF;
  let B = new Float32Array(BW * BH), T = new Float32Array(BW * BH);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (S[y * W + x]) B[((y / CF) | 0) * BW + ((x / CF) | 0)] += 1 / (CF * CF);
  const box = (src, dst, n, stride, count, step) => {
    for (let c = 0; c < count; c++) {
      const base = c * step;
      let sum = 0;
      for (let i = -BOX; i < n + BOX; i++) {
        if (i + BOX < n) sum += src[base + (i + BOX) * stride];
        if (i - BOX - 1 >= 0) sum -= src[base + (i - BOX - 1) * stride];
        if (i >= 0 && i < n) dst[base + i * stride] = sum / (2 * BOX + 1);
      }
    }
  };
  for (let pass = 0; pass < 3; pass++) {
    box(B, T, BW, 1, BH, BW);                      // rows
    box(T, B, BH, BW, BW, 1);                      // columns
  }
  let bmax = 0;
  for (let i = 0; i < B.length; i++) bmax = Math.max(bmax, B[i]);
  // Three box passes of width w have variance 3(w²−1)/12; the landing kernel uses the same sigma.
  const sigma = Math.sqrt(((2 * BOX + 1) ** 2 - 1) / 4) / (PX / CF);
  let inside = 0;
  for (let i = 0; i < S.length; i++) inside += S[i];
  return {
    sigma, bmax, halfW, top, bottom, area: inside / (PX * PX),   // area: stroke area, glyph units²
    S: (ux, uy) => {
      const px = Math.floor((ux - x0) * PX), py = Math.floor((y1 - uy) * PX);
      return px >= 0 && py >= 0 && px < W && py < H && S[py * W + px] === 1;
    },
    B: (ux, uy) => {
      const px = Math.floor((ux - x0) * PX / CF), py = Math.floor((y1 - uy) * PX / CF);
      return px >= 0 && py >= 0 && px < BW && py < BH ? B[py * BW + px] : 0;
    },
  };
}

// Even out the landing points (blue noise inside the strokes) with a few rounds of short-range
// repulsion in plane units. The reach is 1.34 mean spacings of the landing points, so dense strokes
// fill evenly instead of piling up at their edges. Each move is a fraction of that reach, far below
// sigma, so the density that hides the message elsewhere is unchanged; from its eye the strokes
// fill without clumps or holes.
function relax(land, mask) {
  const r = Math.max(0.02, 1.34 * Math.sqrt(mask.area / Math.max(1, land.length))), key = (x, y) => (Math.floor(x / r) + 512) * 1024 + Math.floor(y / r) + 512;
  for (let round = 0; round < 6; round++) {
    const grid = new Map();
    for (const p of land) { const k = key(p[1], p[2]); if (!grid.has(k)) grid.set(k, []); grid.get(k).push(p); }
    for (const p of land) {
      let fx = 0, fy = 0;
      const cx = Math.floor(p[1] / r), cy = Math.floor(p[2] / r);
      for (let gx = cx - 1; gx <= cx + 1; gx++) for (let gy = cy - 1; gy <= cy + 1; gy++) {
        for (const q of grid.get((gx + 512) * 1024 + gy + 512) || []) {
          const dx = p[1] - q[1], dy = p[2] - q[2], d = Math.hypot(dx, dy);
          if (q === p || d >= r || d < 1e-6) continue;
          fx += dx / d * (r - d) * 0.5; fy += dy / d * (r - d) * 0.5;
        }
      }
      for (const s of [1, 0.5]) {                   // stay inside the stroke
        if (mask.S(p[1] + fx * s, p[2] + fy * s)) { p[1] += fx * s; p[2] += fy * s; break; }
      }
    }
  }
}

// ------------------------------------------------------------------ cloud
// Standard normal draws (polar method) from the uniform stream rnd.
function gaussian(rnd) {
  let spare = null;
  return () => {
    if (spare !== null) { const s = spare; spare = null; return s; }
    let u, v, s;
    do { u = rnd() * 2 - 1; v = rnd() * 2 - 1; s = u * u + v * v; } while (s >= 1 || s === 0);
    const m = Math.sqrt(-2 * Math.log(s) / s);
    spare = v * m;
    return u * m;
  };
}

// Layout per particle (10 floats): position, swell direction, seeds (size, phase, rate, colour
// class + 4 for outliers + 8 for text). Text particles come first, grouped by message in sequence
// order, then the ambient ones.
function buildCloud(M) {
  const rand = makeRandom('cloud:' + seed);
  const gauss = gaussian(rand);
  const randDir = () => {
    const z = rand() * 2 - 1, a = rand() * 2 * Math.PI, r = Math.sqrt(1 - z * z);
    return [r * Math.cos(a), z, r * Math.sin(a)];
  };
  const nOut = Math.round(N_TOTAL * OUTLIER_SHARE), nCloud = N_TOTAL - nOut, nMain = Math.round(nCloud * 0.72);
  const P = new Float32Array(N_TOTAL * 3);
  const blobs = [];
  for (let i = 0; i < 6; i++) {
    const d = randDir(), r = 5.5 + 3.2 * rand();
    blobs.push({ c: d.map((v) => v * r), s: 2.0 + 1.4 * rand() });
  }
  for (let i = 0; i < nCloud; i++) {
    let x, y, z;
    if (i < nMain) {
      do { x = 7.2 * gauss(); y = 5.6 * gauss(); z = 7.2 * gauss(); } while (x * x + y * y + z * z > 272);
    } else {
      const b = blobs[i % blobs.length];
      x = b.c[0] + b.s * gauss(); y = b.c[1] + b.s * gauss(); z = b.c[2] + b.s * gauss();
    }
    P[i * 3] = x; P[i * 3 + 1] = y; P[i * 3 + 2] = z;
  }
  for (let i = nCloud; i < N_TOTAL; i++) {          // sparse outliers in a wider sphere
    const d = randDir(), r = Math.cbrt(729 + rand() * (10648 - 729));   // radius 9..22
    P[i * 3] = d[0] * r; P[i * 3 + 1] = d[1] * r; P[i * 3 + 2] = d[2] * r;
  }
  const seeds = new Float32Array(N_TOTAL * 4);      // drawn the same way for every particle
  for (let i = 0; i < N_TOTAL; i++) {
    const c = rand();
    seeds[i * 4] = rand(); seeds[i * 4 + 1] = rand(); seeds[i * 4 + 2] = rand();
    seeds[i * 4 + 3] = (c < 0.67 ? 0 : c < 0.86 ? 1 : c < 0.97 ? 2 : 3) + (i >= nCloud ? 4 : 0);
  }

  // Relocation. For each message m, u_m is where the sight line from m's eye through P meets m's
  // text plane, and w_m = weight_m·B_m(u_m)/max(B_m). The particle's chance of joining m is β·w_m, scaled
  // down where the chances of all messages sum past 1, and one draw over the cumulative chances picks
  // at most one message. It then moves sideways onto a stroke point u' drawn from the same Gaussian
  // around u_m, keeping its distance from m's eye. Density is unchanged at scales above sigma
  // (hidden elsewhere); from m's eye the stroke density is even because rate and landing kernel
  // share B_m. Relocation has its own streams, so the cloud drawn above is the same for every β;
  // each particle takes one pick draw whatever β is.
  // Every particle bobs along a line from one eye (the swell, see the shader): a text particle along
  // its own sight line, an ambient one along the line from a home eye drawn by the shares w_m/Σw
  // (any eye when no message wants it), so off-angle each message's text particles move with the
  // particles around them. The shares do not depend on β, so the homes are the same for every β.
  // Test hook: relocate=<name> moves only that message's particles, the same ones onto the same
  // points; a particle another message would take stays where the base cloud put it, as ambient.
  const n = M.length, only = M.findIndex((m) => m.name === params.get('relocate'));
  const pick = makeRandom('relocate:' + seed), homes = makeRandom('home:' + seed);
  const lands = M.map((m, k) => gaussian(makeRandom((k ? `land${k}:` : 'land:') + seed)));
  const owner = new Int8Array(N_TOTAL).fill(-1);    // the message of each text particle
  const home = new Uint8Array(N_TOTAL);
  const land = M.map(() => []);                     // per message: [particle, u'x, u'y] for each text particle
  const w = new Float64Array(n), ux = new Float64Array(n), uy = new Float64Array(n);
  for (let i = 0; i < N_TOTAL; i++) {
    const chance = i < nCloud ? pick() : 1;
    let sum = 0;
    for (let k = 0; k < n; k++) {
      const { pos, fwd, right, up } = M[k].frame;
      const dx = P[i * 3] - pos[0], dy = P[i * 3 + 1] - pos[1], dz = P[i * 3 + 2] - pos[2];
      const along = dx * fwd[0] + dy * fwd[1] + dz * fwd[2];
      w[k] = 0;
      if (along < 1) continue;
      const s = R / along / M[k].scale;
      ux[k] = s * (dx * right[0] + dy * right[1] + dz * right[2]);
      uy[k] = s * (dx * up[0] + dy * up[1] + dz * up[2]);
      w[k] = (M[k].weight ?? 1) * M[k].mask.B(ux[k], uy[k]) / M[k].mask.bmax;
      sum += w[k];
    }
    const h = homes();
    let hk = Math.min(n - 1, Math.floor(h * n));
    if (sum > 0) {
      let acc = 0;
      for (let k = 0; k < n; k++) if (w[k] > 0) { hk = k; acc += w[k] / sum; if (h < acc) break; }
    }
    home[i] = hk;
    if (i >= nCloud || sum <= 0) continue;
    const scaleDown = Math.max(1, BETA * sum);
    let acc = 0;
    for (let k = 0; k < n; k++) {
      acc += BETA * w[k] / scaleDown;
      if (chance >= acc) continue;
      if (only >= 0 && k !== only) break;
      const { sigma, S } = M[k].mask;
      for (let tries = 0; tries < 64; tries++) {
        const vx = ux[k] + sigma * lands[k](), vy = uy[k] + sigma * lands[k]();
        if (S(vx, vy)) { land[k].push([i, vx, vy]); owner[i] = k; break; }
      }
      break;
    }
  }
  const dirs = new Float32Array(N_TOTAL * 3);
  for (let k = 0; k < n; k++) {
    relax(land[k], M[k].mask);
    const { pos, fwd, right, up } = M[k].frame, s = M[k].scale;
    for (const [i, vx, vy] of land[k]) {
      // T − E for the landing point T on the plane (E = −R·fwd and the plane passes the origin).
      const t = [0, 1, 2].map((a) => R * fwd[a] + (right[a] * vx + up[a] * vy) * s);
      const tl = Math.hypot(t[0], t[1], t[2]);
      const dist = Math.hypot(P[i * 3] - pos[0], P[i * 3 + 1] - pos[1], P[i * 3 + 2] - pos[2]);
      for (let a = 0; a < 3; a++) {
        dirs[i * 3 + a] = t[a] / tl;
        P[i * 3 + a] = pos[a] + dirs[i * 3 + a] * dist;
      }
    }
  }
  for (let i = 0; i < N_TOTAL; i++) {
    if (owner[i] >= 0) continue;
    const e = M[home[i]].frame.pos, d = norm([P[i * 3] - e[0], P[i * 3 + 1] - e[1], P[i * 3 + 2] - e[2]]);
    dirs.set(d, i * 3);
  }
  const counts = M.map(() => 0);
  for (let i = 0; i < N_TOTAL; i++) if (owner[i] >= 0) counts[owner[i]]++;
  const starts = [];
  let nText = 0;
  for (const c of counts) { starts.push(nText); nText += c; }
  const data = new Float32Array(N_TOTAL * 10), next = starts.slice();
  let ai = nText;
  for (let i = 0; i < N_TOTAL; i++) {
    const k = owner[i], o = (k >= 0 ? next[k]++ : ai++) * 10;
    data.set(P.subarray(i * 3, i * 3 + 3), o);
    data.set(dirs.subarray(i * 3, i * 3 + 3), o + 3);
    data.set(seeds.subarray(i * 4, i * 4 + 4), o + 6);
    if (k >= 0) data[o + 9] += 8;
  }
  return { data, nText, nAmbient: N_TOTAL - nText, counts, starts };
}

// The messages with their eyes, masks and scales. "hello world" sets the width every other
// message may fill.
const M = MESSAGES.map((msg) => ({ ...msg, frame: eyeFrame(msg.az, msg.el), layout: layout(msg) }));

  m.scale ??= Math.min(m.cap, (FIT_INK - INK / 2 * Math.hypot(1, m.layout.lean)) / ((m.layout.inkR - m.layout.inkL) / 2));
  m.mask = buildMask(m.layout, m.scale);
}

const FIT_HALF_WIDTH = Math.max(...M.map((m) => m.mask.halfW * m.scale)) * 1.22;   // world units the view must keep visible at an eye

// ------------------------------------------------------------------ camera state
const cam = { az: START.az * DEG, el: START.el * DEG, zoom: 1 };

let anim = null;            // eased camera move: from, deltas, start time, duration, easing
let seq = null;             // the sequence while it plays: steps, position, loop, cut

let cursor = -1;            // the message last reached or picked; "Find the angle" goes to the next

let lastInput = -Infinity;
let gestureFrom = M.map(() => 0);   // alignment with each eye when the current gesture began, degrees
let gestureDrag = { x: 0, y: 0 };   // net one-finger drag since the current gesture began, CSS px

// Test hooks: msg=<name> puts the camera at that message's eye; az and el then override it.
const msgParam = M.findIndex((m) => m.name === params.get('msg'));
if (msgParam >= 0) { cam.az = wrapPi(M[msgParam].az * DEG); cam.el = M[msgParam].el * DEG; cursor = msgParam; }
const azParam = numParam('az'), elParam = numParam('el'), fovParam = numParam('fov');
if (azParam !== null) cam.az = wrapPi(azParam * DEG);
if (elParam !== null) cam.el = clamp(elParam * DEG, -EL_LIMIT, EL_LIMIT);
// textof=<name> with layer=text draws only that message's text particles.
const textOf = layer === 'text' ? M.findIndex((m) => m.name === params.get('textof')) : -1;

const canvas = document.getElementById('scene');
const readout = document.getElementById('readout');
const findBtn = document.getElementById('find');
const playBtn = document.getElementById('play');
const hintEl = document.getElementById('hint');
document.documentElement.classList.toggle('capture', capture);
const dpr = () => Math.min(window.devicePixelRatio || 1, 2);
const viewAspect = () => (canvas.clientWidth || innerWidth) / Math.max(1, canvas.clientHeight || innerHeight);
// Vertical tan(fov/2) before zoom: widened on narrow screens so every message fits with margin.
const baseTan = (aspect) => Math.max(Math.tan(BASE_FOV * DEG / 2), FIT_HALF_WIDTH / R / aspect);
const tanHalf = () => baseTan(viewAspect()) / cam.zoom;
const clampZoom = (z) => clamp(z, ZOOM_MIN, ZOOM_MAX);
if (fovParam !== null) cam.zoom = clampZoom(baseTan(viewAspect()) / Math.tan(clamp(fovParam, 1, 170) * DEG / 2));
const alignTo = (k) => angleBetween(eyeDir(cam.az, cam.el), M[k].frame.dir) / DEG;
const alignDeg = () => alignTo(0);                // degrees from hello world's eye E
const atMessage = () => M.findIndex((m, k) => alignTo(k) < 1e-3);

    frame: { enumerable: true, get: () => frames },
    magic: { enumerable: true, value: MAGIC },
    messages: { enumerable: true, value: freeze(M.map((m) => freeze({ name: m.name, az: m.az, el: m.el }))) },
    counts: { enumerable: true, value: freeze({ text: cloud.nText, ambient: cloud.nAmbient, byMessage: freeze(Object.fromEntries(M.map((m, k) => [m.name, cloud.counts[k]]))) }) },
    view: { enumerable: true, value: () => ({ az: wrapDeg(cam.az / DEG), el: cam.el / DEG, fov: 2 * Math.atan(tanHalf()) / DEG }) },
    alignment: { enumerable: true, value: () => alignDeg() },

// ------------------------------------------------------------------ WebGL
const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false });

const PARTICLE_VS = `#version 300 es
precision highp float;
layout(location = 0) in vec3 a_pos;
layout(location = 1) in vec3 a_dir;    // unit swell direction: along the line from an eye
layout(location = 2) in vec4 a_seed;   // size, phase, rate, colour class (+4 outlier, +8 text)
uniform mat4 u_view, u_proj;
uniform float u_time, u_ppu, u_aperture, u_focus, u_minPx, u_maxPx, u_swell;
uniform vec3 u_pal[4];                 // moon, cyan, lavender, amber
out vec3 v_col;
out float v_quad, v_core, v_disc, v_blur;

// Smooth travelling phase: neighbours bob together.
float swell(vec3 p, float t) {
  return 0.5 * t + dot(p, vec3(0.17, 0.21, -0.13)) + 0.9 * sin(dot(p, vec3(-0.11, 0.09, 0.16)) + 0.2 * t);
}
// Coherent drift for ambient particles: a few transverse plane waves, about 0.4 units at most.
vec3 drift(vec3 p, float t) {
  return vec3(0.62, 0.12, -0.78) * (0.16 * sin(dot(p, vec3(0.06, 0.31, 0.17)) + 0.29 * t + 1.3))
       + vec3(-0.10, 0.83, 0.55) * (0.14 * sin(dot(p, vec3(0.30, 0.03, -0.12)) + 0.34 * t + 4.1))
       + vec3(0.70, -0.42, 0.58) * (0.12 * sin(dot(p, vec3(-0.15, 0.21, 0.24)) + 0.23 * t + 2.2));
}

void main() {
  int code = int(a_seed.w + 0.5);
  bool outlier = (code & 4) != 0;
  float t = u_time;
  // Every particle bobs along its line from an eye: a text particle along its own sight line, so
  // its message never moves as seen from its eye; an ambient one along the line from its home eye.
  vec3 p = a_pos + a_dir * (u_swell * sin(swell(a_pos, t)));
  if (code < 8) {
    // Ambient particles also drift and wobble a little; that is what an eye sees move.
    vec3 wob = 0.06 * sin(vec3(0.71, 0.93, 0.82) * t * (0.6 + a_seed.z) + a_seed.y * vec3(6.283, 12.1, 3.7));
    p += drift(a_pos, t) + wob;
  }
  vec4 vp = u_view * vec4(p, 1.0);
  float depth = max(-vp.z, 0.05);
  gl_Position = u_proj * vp;

  float wsize = outlier ? mix(0.07, 0.16, a_seed.x) : mix(0.045, 0.17, pow(a_seed.x, 3.0));
  float core = wsize * u_ppu / depth;                     // perspective size in device px
  float energy = 1.0;
  if (core < u_minPx) { energy = (core / u_minPx) * (core / u_minPx); core = u_minPx; }
  float coc = u_aperture * u_ppu * abs(depth - u_focus) / (depth * u_focus);
  float disc = core + coc;
  energy *= max((core / disc) * (core / disc), 0.05);     // blur spreads the same light wider
  float quad = min(max(core * 3.2, disc + 2.0), u_maxPx);
  gl_PointSize = quad;

  float rate = 0.5 + 1.8 * a_seed.z;
  float tw = 0.76 + 0.24 * sin(t * rate + a_seed.y * 6.2832);
  tw += 0.6 * pow(max(0.0, sin(t * 0.37 * rate + a_seed.y * 40.0)), 30.0);
  float fade = mix(1.0, 0.55, smoothstep(u_focus - 8.0, u_focus + 14.0, depth));
  float level = 0.46 * (0.5 + fract(a_seed.y * 13.37));
  // Text and ambient particles follow the same rules at every angle, every eye included: each
  // message shows from its eye only because its particles line up there.
  v_col = u_pal[code & 3] * (level * tw * fade * energy);
  v_quad = quad; v_core = core; v_disc = disc; v_blur = coc / disc;
}`;

const PARTICLE_FS = `#version 300 es
precision highp float;
in vec3 v_col;
in float v_quad, v_core, v_disc, v_blur;
out vec4 o;
void main() {
  float r = length(gl_PointCoord - 0.5) * v_quad;        // device px from the sprite centre
  float sc = max(0.36 * v_core, 0.55);
  float k = r * r / (sc * sc);
  float sharp = exp(-0.5 * k) + 0.08 * exp(-0.125 * k);  // Gaussian core plus a faint halo
  float rd = 0.5 * v_disc;
  float disc = 1.6 * clamp(rd - r + 0.5, 0.0, 1.0) * (0.8 + 0.2 * clamp(r / rd, 0.0, 1.0));
  float shape = mix(sharp, disc, smoothstep(0.1, 0.8, v_blur));
  if (shape < 0.003) discard;
  o = vec4(v_col * shape, 1.0);
}`;

const SKY_VS = `#version 300 es
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const SKY_FS = `#version 300 es
precision highp float;
uniform vec2 u_res;
uniform float u_horizon, u_el;
uniform vec3 u_top, u_bottom, u_glow;
out vec4 o;
float hash(vec2 p) { vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
void main() {
  vec2 uv = gl_FragCoord.xy / u_res;
  vec3 col = mix(u_bottom, u_top, smoothstep(-0.55, 0.85, uv.y - u_horizon));
  vec2 d = (gl_FragCoord.xy - 0.5 * u_res) / u_res.y;
  d.y += 0.12 * u_el;                                     // the glow drifts a little with elevation
  col += u_glow * (0.85 * exp(-dot(d, d) * 5.0));
  col += (hash(gl_FragCoord.xy) - 0.5) / 255.0 * 1.5;   // dither against banding
  o = vec4(col, 1.0);
}`;

const tokenColor = (name, fallback) => {

  return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255];
};
const COLORS = {
  top: tokenColor('--sky-top', [0.01, 0.02, 0.04]),
  bottom: tokenColor('--sky-bottom', [0.04, 0.09, 0.19]),

canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); glr = null; });
canvas.addEventListener('webglcontextrestored', () => { try { initGL(); } catch (err) { fail(err.message); } });

function viewMatrix(eye) {
  const f = norm([-eye[0], -eye[1], -eye[2]]);
  const r = norm(cross(f, [0, 1, 0]));
  const u = cross(r, f);
  return new Float32Array([r[0], u[0], -f[0], 0, r[1], u[1], -f[1], 0, r[2], u[2], -f[2], 0, -dot(r, eye), -dot(u, eye), dot(f, eye), 1]);
}
function projMatrix(th, aspect, near, far) {
  const f = 1 / th;
  return new Float32Array([f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) / (near - far), -1, 0, 0, 2 * far * near / (near - far), 0]);
}

let clock = fixedT ?? 0;    // particle clock, seconds
function draw() {
  const ratio = dpr();
  const w = Math.max(1, Math.round(canvas.clientWidth * ratio)), h = Math.max(1, Math.round(canvas.clientHeight * ratio));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  if (!glr) return;
  const th = tanHalf(), aspect = w / h;
  const eye = eyeDir(cam.az, cam.el).map((v) => v * R);
  gl.viewport(0, 0, w, h);
  gl.disable(gl.BLEND);
  const sky = glr.sky;
  gl.useProgram(sky.p);
  gl.uniform2f(sky.u.u_res, w, h);
  gl.uniform1f(sky.u.u_horizon, 0.5 + 0.5 * Math.tan(cam.el) / th);
  gl.uniform1f(sky.u.u_el, cam.el);
  gl.uniform3fv(sky.u.u_top, COLORS.top);
  gl.uniform3fv(sky.u.u_bottom, COLORS.bottom);
  gl.uniform3fv(sky.u.u_glow, COLORS.glow);
  gl.bindVertexArray(glr.skyVao);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  const pr = glr.particles, u = pr.u;
  gl.useProgram(pr.p);
  gl.uniformMatrix4fv(u.u_view, false, viewMatrix(eye));
  gl.uniformMatrix4fv(u.u_proj, false, projMatrix(th, aspect, 0.5, 120));
  gl.uniform1f(u.u_time, clock);
  gl.uniform1f(u.u_ppu, h / 2 / th);
  gl.uniform1f(u.u_aperture, 0.14);
  gl.uniform1f(u.u_focus, R);
  gl.uniform1f(u.u_minPx, 1.5);
  gl.uniform1f(u.u_maxPx, Math.min(glr.maxPoint, 160 * ratio));
  gl.uniform1f(u.u_swell, SWELL);
  gl.uniform3fv(u.u_pal, COLORS.pal);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);                 // additive, premultiplied colour
  gl.bindVertexArray(glr.vao);
  if (layer === 'text') {
    if (textOf >= 0) gl.drawArrays(gl.POINTS, cloud.starts[textOf], cloud.counts[textOf]);
    else gl.drawArrays(gl.POINTS, 0, cloud.nText);
  } else if (layer === 'ambient') gl.drawArrays(gl.POINTS, cloud.nText, cloud.nAmbient);
  else gl.drawArrays(gl.POINTS, 0, N_TOTAL);
  gl.bindVertexArray(null);
}

// ------------------------------------------------------------------ camera motion
const tourAllowed = () => tourParam && !reduced;
const msgTarget = (k, zoom) => ({ az: M[k].az * DEG, el: M[k].el * DEG, zoom });
const alignments = () => M.map((m, k) => alignTo(k));

function beginAnim(target, ms, ease) {
  const now = performance.now();
  anim = target
    ? { az0: cam.az, el0: cam.el, z0: cam.zoom, daz: wrapPi(target.az - cam.az), del: target.el - cam.el, dz: (target.zoom ?? cam.zoom) - cam.zoom, t0: now, ms, ease, target }
    : { t0: now, ms, target: null };    // a hold
}
function stepAnim(now) {
  const k = clamp((now - anim.t0) / anim.ms, 0, 1);
  if (anim.target) {
    const s = anim.ease(k);
    cam.az = wrapPi(anim.az0 + anim.daz * s);
    cam.el = anim.el0 + anim.del * s;
    cam.zoom = anim.z0 + anim.dz * s;
  }
  if (k < 1) return false;
  if (anim.target) { cam.az = wrapPi(anim.target.az); cam.el = anim.target.el; cam.zoom = anim.target.zoom ?? cam.zoom; }
  anim = null;
  return true;
}

// The sequence: from wherever the camera is, an eased glide to each message's eye in sequence
// order, then a hold exactly there. At load it plays once after a short hold on the start view and
// ends holding at the last message; Play plays it again; capture mode loops it, gliding from the
// last message back to the first. Under reduced motion it cuts from hold to hold instead, and it
// never plays at load. Any input stops it.
function playSequence({ hold = 0, loop = false, auto = false } = {}) {
  mode = 'tour';
  anim = null; heading = -1; vel = { az: 0, el: 0 };
  seq = { steps: hold ? [{ hold, at: -1 }] : [], i: 0, first: hold ? 1 : 0, loop, auto, cut: reduced, zoom: Math.min(cam.zoom, 1) };
  for (let k = 0; k < M.length; k++) seq.steps.push({ go: k }, { hold: HOLD_MS, at: k });
  nextStep();
}
function nextStep() {
  if (seq.i >= seq.steps.length) {
    if (!seq.loop) { seq = null; mode = 'idle'; heading = -1; return; }
    seq.i = seq.first;
  }
  const s = seq.steps[seq.i++];
  if (s.go === undefined) {
    if (s.at >= 0) cursor = s.at;
    heading = s.at;
    beginAnim(null, s.at >= 0 && seq.cut ? CUT_HOLD_MS : s.hold);
    return;
  }
  heading = s.go;
  const target = msgTarget(s.go, seq.zoom);
  if (seq.cut) {
    cam.az = wrapPi(target.az); cam.el = target.el; cam.zoom = target.zoom;
    nextStep();
    return;
  }
  beginAnim(target, legMs(alignTo(s.go)), easeQuint);
}
function stopAuto() {
  if (mode === 'tour' || mode === 'glide' || mode === 'snap' || mode === 'inertia') mode = 'idle';
  anim = null; seq = null; heading = -1; vel = { az: 0, el: 0 };
}
// The camera came to rest: ease into exact alignment with an eye when close, unless this gesture
// moved away from it.
function settle() {
  vel = { az: 0, el: 0 };
  mode = 'idle';
  for (let k = 0; k < M.length; k++) {
    const d = alignTo(k);
    if (!(d < SNAP_DEG && d > 1e-4 && d <= gestureFrom[k] + 0.1)) continue;
    cursor = k;
    if (reduced) Object.assign(cam, { az: wrapPi(M[k].az * DEG), el: M[k].el * DEG });
    else { mode = 'snap'; heading = k; beginAnim(msgTarget(k, cam.zoom), SNAP_MS, easeSine); }
    return;
  }
}
// Capture mode (#capture): no chrome, no cursor, and the sequence loops; only Escape ends it.
function setCapture(on) {
  if (on === capture) return;
  capture = on;
  document.documentElement.classList.toggle('capture', on);
  stopAuto();
  pointers.clear(); pinch = null;
  canvas.classList.remove('grabbing');
  if (on) { autoplayed = true; playSequence({ hold: CAPTURE_HOLD_MS, loop: true }); }
}
// Escape also takes the bare #capture anchor out of the address, without a reload, so adding it
// again starts capture mode again. A host that blocks history changes keeps the anchor.
function dropCaptureAnchor() {
  if (location.hash !== '#capture') return;
  try { history.replaceState(history.state, '', location.href.replace(/#.*$/, '')); } catch { /* the host blocks history changes */ }
}

function stepCamera(now, dt) {
  if (mode === 'inertia') {
    cam.az = wrapPi(cam.az + vel.az * dt);
    const el = cam.el + vel.el * dt;
    cam.el = clamp(el, -EL_LIMIT, EL_LIMIT);
    if (cam.el !== el) vel.el = 0;
    const decay = Math.exp(-dt / 0.3);
    vel.az *= decay; vel.el *= decay;
    if (Math.hypot(vel.az, vel.el) < 0.02) settle();
  } else if (anim && (mode === 'tour' || mode === 'glide' || mode === 'snap')) {
    if (stepAnim(now)) { if (mode === 'tour') nextStep(); else { mode = 'idle'; heading = -1; } }
  } else if (mode === 'idle' && !autoplayed && lastInput === -Infinity && (capture || tourAllowed())) {
    autoplayed = true;
    if (capture) playSequence({ hold: CAPTURE_HOLD_MS, loop: true });
    else playSequence({ hold: LOAD_HOLD_MS, auto: true });
  }
}

// ------------------------------------------------------------------ input
const noteInput = () => { lastInput = performance.now(); };
const pointers = new Map();
let samples = [];           // recent drag positions for the release velocity
let pinch = null, dragged = 0;
const sample = () => { const t = performance.now(); samples.push({ t, az: cam.az, el: cam.el }); while (samples.length && t - samples[0].t > 120) samples.shift(); };
const spread = () => { const [a, b] = [...pointers.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };

canvas.addEventListener('pointerdown', (e) => {
  if (capture || (e.pointerType === 'mouse' && e.button !== 0)) return;
  try { canvas.setPointerCapture(e.pointerId); } catch { /* pointer already gone */ }
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  noteInput();
  // A finger added mid-gesture forgives the drag so far only while it is within the touch slop:
  // a pinch that starts at an eye still ends there, but a deliberate drag away still counts.
  if (mode !== 'drag') { gestureFrom = alignments(); gestureDrag = { x: 0, y: 0 }; }
  else if (Math.hypot(gestureDrag.x, gestureDrag.y) < TOUCH_SLOP) gestureFrom = gestureFrom.map((g, k) => Math.max(g, alignTo(k)));
  stopAuto();
  mode = 'drag';
  samples = [];
  sample();
  pinch = pointers.size === 2 ? { d: spread(), zoom: cam.zoom } : null;
  canvas.classList.add('grabbing');
});
canvas.addEventListener('pointermove', (e) => {
  const p = pointers.get(e.pointerId);
  if (!p || capture) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  noteInput();
  if (pointers.size === 1) {
    cam.az = wrapPi(cam.az - dx * DRAG_RATE);
    cam.el = clamp(cam.el + dy * DRAG_RATE, -EL_LIMIT, EL_LIMIT);
    dragged += Math.abs(dx) + Math.abs(dy);
    gestureDrag.x += dx; gestureDrag.y += dy;
    if (dragged > 6) hintEl.classList.add('gone');
    sample();
  } else if (pinch && pinch.d > 0) {
    cam.zoom = clampZoom(pinch.zoom * spread() / pinch.d);
  }
});
const release = (e) => {
  if (!pointers.delete(e.pointerId)) return;
  noteInput();
  samples = [];
  sample();
  if (pointers.size === 2) pinch = { d: spread(), zoom: cam.zoom };
  else pinch = null;
  if (pointers.size) return;                    // the remaining finger keeps dragging
  canvas.classList.remove('grabbing');
};
canvas.addEventListener('pointerup', (e) => {
  const recent = samples.slice();
  release(e);
  if (pointers.size || mode !== 'drag') return;
  // Release velocity from the last ~100 ms of movement; a pause before release means no coast.
  const now = performance.now(), a = recent[0], b = recent[recent.length - 1];
  const dt = b && a ? (b.t - a.t) / 1000 : 0;
  if (dt > 0.012 && now - b.t < 60) {
    vel = { az: wrapPi(b.az - a.az) / dt, el: (b.el - a.el) / dt };
    const speed = Math.hypot(vel.az, vel.el), cap = 3;   // rad/s; coasts at most about 50°
    if (speed > cap) { vel.az *= cap / speed; vel.el *= cap / speed; }
    if (speed > 0.15 && !reduced) { mode = 'inertia'; return; }   // reduced motion: no coast
  }
  settle();
});
canvas.addEventListener('pointercancel', (e) => { release(e); if (!pointers.size && mode === 'drag') settle(); });
canvas.addEventListener('lostpointercapture', (e) => { if (pointers.has(e.pointerId)) { release(e); if (!pointers.size && mode === 'drag') settle(); } });

// Zoom changes only the field of view. A running snap or glide keeps going and carries the new
// zoom to its end; the sequence or a coast stops, as with any other input.
function zoomBy(f) {
  cam.zoom = clampZoom(cam.zoom * f);
  if (anim && anim.target && (mode === 'snap' || mode === 'glide')) { anim.z0 = cam.zoom; anim.dz = 0; anim.target.zoom = cam.zoom; }
  else if (mode !== 'drag') stopAuto();
}
window.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (capture) return;
  const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1;
  noteInput();
  zoomBy(Math.exp(-e.deltaY * unit * 0.0015));
}, { passive: false });

window.addEventListener('keydown', (e) => {
  if (capture) {
    if (e.key === 'Escape') { e.preventDefault(); noteInput(); setCapture(false); dropCaptureAnchor(); }
    return;
  }
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  // Keys steer unless a text field has focus; Tab is never handled, so focus order is untouched.
  const focus = document.activeElement;
  if (focus && (focus.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(focus.tagName))) return;
  const step = 2 * DEG;
  const keys = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, step], ArrowDown: [0, -step] };
  const zoomKeys = { '+': 1.12, '=': 1.12, '-': 1 / 1.12, '_': 1 / 1.12 };
  if (!(e.key in keys) && !(e.key in zoomKeys)) return;
  e.preventDefault();
  noteInput();
  if (mode === 'drag') return;
  if (e.key in zoomKeys) { zoomBy(zoomKeys[e.key]); return; }
  stopAuto();
  hintEl.classList.add('gone');
  gestureFrom = alignments();
  // Arrow keys move the viewpoint: right orbits the eye to its right, up raises it.
  cam.az = wrapPi(cam.az + keys[e.key][0]);
  cam.el = clamp(cam.el + keys[e.key][1], -EL_LIMIT, EL_LIMIT);
  settle();
});

// "Find the angle" glides to the next message's eye in sequence order (the first from the start).
findBtn.addEventListener('click', () => {
  if (capture) return;
  noteInput();
  stopAuto();
  const k = (cursor + 1) % M.length, target = msgTarget(k, Math.min(cam.zoom, 1));
  cursor = k;
  if (reduced) { Object.assign(cam, { az: wrapPi(target.az), el: target.el, zoom: target.zoom }); mode = 'idle'; return; }
  mode = 'glide';
  heading = k;
  beginAnim(target, GLIDE_MS, easeCubic);
});
playBtn.addEventListener('click', () => {
  if (capture) return;
  noteInput();
  stopAuto();
  playSequence();
});
window.addEventListener('hashchange', () => setCapture(location.hash === '#capture'));

motionQuery.addEventListener('change', (e) => {
  reduced = e.matches;
  // The sequence at load stops. One the viewer asked for (Play, capture) cuts from here on: a glide
  // under way ends at its eye at once, and the hold there is a cut hold.
  if (!reduced || !seq) return;
  if (seq.auto) { stopAuto(); return; }
  seq.cut = true;
  if (anim && anim.target) {
    cam.az = wrapPi(anim.target.az); cam.el = anim.target.el; cam.zoom = anim.target.zoom ?? cam.zoom;
    anim = null;
    nextStep();
  }
});

// ------------------------------------------------------------------ main loop
let lastText = '';
function updateReadout() {
  let az = ((cam.az / DEG) % 360 + 360) % 360;
  if (az >= 359.95) az = 0;
  const text = `AZ ${az.toFixed(1)}° · EL ${(cam.el / DEG).toFixed(1)}°`;
  if (text !== lastText) { readout.textContent = text; lastText = text; }
}
let last = performance.now();
function tick(now) {
  const dt = clamp((now - last) / 1000, 0, 0.1);
  last = now;
  if (fixedT === null) clock += dt * (reduced ? 0.35 : 1);
  stepCamera(now, dt);
  draw();
  updateReadout();
  if (glr) { frames++; ready = true; }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
})();
</script>
</body>
